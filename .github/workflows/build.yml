name: Build Vanadium WebView Magisk Module

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: build-vanadium-webview
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find latest Vanadium APK commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROJECT_API="https://gitlab.com/api/v4/projects/grapheneos%2Fplatform_external_vanadium/repository/commits"
          WEBVIEW_JSON=$(curl -sf --retry 3 \
            "${PROJECT_API}?path=prebuilt%2Farm64-multilib%2FVanadiumWebView.apk&per_page=1") || {
            echo "::error::Failed to query the Vanadium WebView APK commit from GitLab"
            exit 1
          }
          CONFIG_JSON=$(curl -sf --retry 3 \
            "${PROJECT_API}?path=prebuilt%2FVanadiumConfig.apk&per_page=1") || {
            echo "::error::Failed to query the Vanadium Config APK commit from GitLab"
            exit 1
          }

          WEBVIEW_ENTRY=$(echo "$WEBVIEW_JSON" | jq -er '.[0] | [.committed_date, .id] | @tsv') || {
            echo "::error::GitLab returned no commit for VanadiumWebView.apk"
            exit 1
          }
          CONFIG_ENTRY=$(echo "$CONFIG_JSON" | jq -er '.[0] | [.committed_date, .id] | @tsv') || {
            echo "::error::GitLab returned no commit for VanadiumConfig.apk"
            exit 1
          }
          WEBVIEW_DATE="${WEBVIEW_ENTRY%%$'\t'*}"
          WEBVIEW_COMMIT="${WEBVIEW_ENTRY#*$'\t'}"
          CONFIG_DATE="${CONFIG_ENTRY%%$'\t'*}"
          CONFIG_COMMIT="${CONFIG_ENTRY#*$'\t'}"
          if [[ "$CONFIG_DATE" > "$WEBVIEW_DATE" ]]; then
            SOURCE_COMMIT="$CONFIG_COMMIT"
          else
            SOURCE_COMMIT="$WEBVIEW_COMMIT"
          fi

          echo "Latest APK commit: $SOURCE_COMMIT"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          SOURCE_SHORT="${SOURCE_COMMIT:0:12}"
          RELEASE_TAGS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name') || {
            echo "::error::Failed to list existing GitHub Releases"
            exit 1
          }
          if grep -Eq -- "-${SOURCE_SHORT}$" <<< "$RELEASE_TAGS"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A release already exists for source commit $SOURCE_SHORT."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Vanadium WebView APK
        if: steps.source.outputs.skip == 'false'
        run: |
          APK_URL="https://gitlab.com/grapheneos/platform_external_vanadium/-/raw/${{ steps.source.outputs.commit }}/prebuilt/arm64-multilib/VanadiumWebView.apk"
          CONFIG_URL="https://gitlab.com/grapheneos/platform_external_vanadium/-/raw/${{ steps.source.outputs.commit }}/prebuilt/VanadiumConfig.apk"
          echo "Downloading $APK_URL"
          curl -fL --retry 3 -o module/system/app/webview/webview.apk "$APK_URL"
          mkdir -p module/system/app/VanadiumConfig
          echo "Downloading $CONFIG_URL"
          curl -fL --retry 3 -o module/system/app/VanadiumConfig/VanadiumConfig.apk "$CONFIG_URL"
          if [ ! -s module/system/app/webview/webview.apk ]; then
            echo "::error::Downloaded Vanadium WebView APK is empty or missing"
            exit 1
          fi
          if [ ! -s module/system/app/VanadiumConfig/VanadiumConfig.apk ]; then
            echo "::error::Downloaded Vanadium Config APK is empty or missing"
            exit 1
          fi

      - name: Read APK version and update module metadata
        if: steps.source.outputs.skip == 'false'
        id: version
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n1)
          BADGING=$("$AAPT2" dump badging module/system/app/webview/webview.apk)
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -n1)
          MIN_SDK=$(echo "$BADGING" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from VanadiumWebView.apk"
            exit 1
          fi

          SOURCE_SHORT="${{ steps.source.outputs.commit }}"
          SOURCE_SHORT="${SOURCE_SHORT:0:12}"
          RELEASE_TAG="v${VERSION_NAME}-${SOURCE_SHORT}"
          VERSION_CODE=$(date +%s)
          echo "Vanadium version: $VERSION_NAME; source commit: $SOURCE_SHORT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          sed -i "s|^version=.*|version=${VERSION_NAME}|" module/module.prop
          sed -i "s|^versionCode=.*|versionCode=${VERSION_CODE}|" module/module.prop
          if [ -n "$MIN_SDK" ]; then
            if [ "$MIN_SDK" -lt 30 ]; then
              MIN_SDK=30
            fi
            sed -i "s|^minApi=.*|minApi=${MIN_SDK}|" module/module.prop
          else
            sed -i "s|^minApi=.*|minApi=30|" module/module.prop
          fi
          cat module/module.prop

      - name: Build WebView provider overlay
        if: steps.source.outputs.skip == 'false'
        env:
          OVERLAY_KEYSTORE_B64: ${{ secrets.VANADIUM_OVERLAY_KEYSTORE_B64 }}
          OVERLAY_KEYSTORE_PASSWORD: ${{ secrets.VANADIUM_OVERLAY_KEYSTORE_PASSWORD }}
        run: |
          OVERLAY_APK="module/system/product/overlay/VanadiumWebViewProviderOverlay.apk"
          mkdir -p module/system/product/overlay
          if [ -z "$OVERLAY_KEYSTORE_B64" ] || [ -z "$OVERLAY_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set VANADIUM_OVERLAY_KEYSTORE_B64 and VANADIUM_OVERLAY_KEYSTORE_PASSWORD repository secrets"
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          AAPT2="$BUILD_TOOLS/aapt2"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -name android.jar | sort -V | tail -n1)
          if [ ! -x "$AAPT2" ] || [ ! -x "$APK_SIGNER" ] || [ -z "$ANDROID_JAR" ]; then
            echo "::error::Android SDK build tools and platform android.jar are required to build the provider overlay"
            exit 1
          fi

          echo "$OVERLAY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/overlay.keystore"

          mkdir -p "$RUNNER_TEMP/vanadium-overlay"
          "$AAPT2" compile --dir overlay/res -o "$RUNNER_TEMP/vanadium-overlay/resources.zip"
          "$AAPT2" link \
            -o "$RUNNER_TEMP/vanadium-overlay/overlay-unsigned.apk" \
            --manifest overlay/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            --min-sdk-version 30 --target-sdk-version 30 \
            --version-code 1 --version-name 1.0 \
            --no-resource-deduping --no-resource-removal \
            "$RUNNER_TEMP/vanadium-overlay/resources.zip"
          "$APK_SIGNER" sign \
            --ks "$RUNNER_TEMP/overlay.keystore" \
            --ks-pass "pass:$OVERLAY_KEYSTORE_PASSWORD" \
            --key-pass "pass:$OVERLAY_KEYSTORE_PASSWORD" \
            --out "$OVERLAY_APK" \
            "$RUNNER_TEMP/vanadium-overlay/overlay-unsigned.apk"

          "$APK_SIGNER" verify --verbose "$OVERLAY_APK"

      - name: Build Magisk module zip
        if: steps.source.outputs.skip == 'false'
        id: build
        run: |
          ZIP_NAME="VanadiumSystemWebView-${{ steps.version.outputs.release_tag }}.zip"
          cd module
          chmod +x customize.sh post-fs-data.sh META-INF/com/google/android/update-binary
          zip -r "../${ZIP_NAME}" . -x '*.gitkeep' -x '*.git*'
          cd ..
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Magisk update metadata
        if: steps.source.outputs.skip == 'false'
        run: |
          TAG="${{ steps.version.outputs.release_tag }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          ZIP_NAME="${{ steps.build.outputs.zip_name }}"
          REPO="${{ github.repository }}"
          jq -n \
            --arg version "$TAG" \
            --argjson versionCode "$VERSION_CODE" \
            --arg zipUrl "https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}" \
            --arg changelog "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json

      - name: Create GitHub Release
        if: steps.source.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Vanadium WebView ${{ steps.version.outputs.version_name }}
          body: |
            ## Vanadium System WebView — Magisk Module

            Automated build from [GrapheneOS Vanadium](https://gitlab.com/grapheneos/platform_external_vanadium/-/commit/${{ steps.source.outputs.commit }}), APK version ${{ steps.version.outputs.version_name }}.

            Install the attached ZIP through Magisk Manager and reboot.
          files: ${{ steps.build.outputs.zip_name }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Magisk metadata
        if: steps.source.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update Magisk metadata for Vanadium WebView ${{ steps.version.outputs.version_name }}"
          git push
